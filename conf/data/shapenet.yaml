  chunk_size: ${data.batch_size}
  surface_chunk_factor: ${data.surface_chunk_factor}
  close_chunk_factor: ${data.close_chunk_factor}
  empty_chunk_factor: ${data.empty_chunk_factor}
  use_full_chunk:  ${data.use_full_chunk}
  # subsampling settings
  resolution: ${data.resolution}
  domain: ${data.domain}
  max_surface_points: ${data.max_surface_points}
  max_close_points: ${data.max_close_points}
  max_empty_points: ${data.max_empty_points}
  # empty space sampling
  empty_points_per_ray: ${data.empty_points_per_ray}
  close_points_per_ray: ${data.close_points_per_ray}
  close_points_surface_threshold: ${data.close_points_surface_threshold}
  # vector field settings 
  vector_field_mode: ${data.vector_field_mode}
  vector_field_chunk_size: ${data.vector_field_chunk_size}
  k: ${data.k}
